name: Build and Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build
        run: cargo tauri build

      - name: Package
        run: |
          mkdir package
          copy target\release\voice_bird_desktop.exe package\voice-bird-desktop.exe
          Compress-Archive -Path package\* -DestinationPath voice-bird-desktop-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: voice-bird-desktop-x86_64-pc-windows-msvc.zip

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add target
        run: rustup target add x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Package
        run: |
          cd target/x86_64-apple-darwin/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/voice-bird-desktop-x86_64-apple-darwin.zip" "Voice Bird Desktop.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: voice-bird-desktop-x86_64-apple-darwin.zip

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add target
        run: rustup target add aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Package
        run: |
          cd target/aarch64-apple-darwin/release/bundle/macos
          zip -r "$GITHUB_WORKSPACE/voice-bird-desktop-aarch64-apple-darwin.zip" "Voice Bird Desktop.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: voice-bird-desktop-aarch64-apple-darwin.zip

  release:
    needs: [build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release on PUBLIC repo
        uses: softprops/action-gh-release@v1
        with:
          repository: RekunDzmitry/voice-bird-releases
          files: |
            windows-x64/voice-bird-desktop-x86_64-pc-windows-msvc.zip
            macos-x64/voice-bird-desktop-x86_64-apple-darwin.zip
            macos-arm64/voice-bird-desktop-aarch64-apple-darwin.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
