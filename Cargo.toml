[package]
name = "voice-bird"
version = "0.3.0"
edition = "2021"
description = "Voice Bird — local voice transcription TUI"

[[bin]]
name = "voice-bird"
path = "src/main.rs"

[lib]
name = "voice_bird"
path = "src/lib.rs"

[workspace]
members = [".", "xtask"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Audio
cpal = "0.15"
hound = "3.5"
rubato = "0.14"

# Async
tokio = { version = "1.0", features = ["full"] }

# WebSocket client for AssemblyAI cloud engine. Uses rustls (consistent
# with reqwest already in-tree) rather than native-tls to keep a single
# TLS backend across the crate.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"

# Logging
log = "0.4"
fern = "0.7"

# Clipboard
arboard = "3"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"

# Transcription (populated in Stage 3)
# `metal` enables whisper.cpp's Metal backend on macOS (~5–10× CPU speedup).
# Non-Apple targets ignore the feature at whisper.cpp's build.rs level.
whisper-rs = { version = "0.13", features = ["metal", "whisper-cpp-log"] }

# Model download + verification
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "stream"] }
sha2 = "0.10"
hex = "0.4"

# WhisperKit sidecar IPC (length-prefixed binary samples over stdio)
bytemuck = "1"

[features]
engine-smoke = []
# Requires ASSEMBLYAI_API_KEY env var at test time; hits the real service.
engine-smoke-assemblyai = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
pretty_assertions = "1"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# System-audio loopback on macOS via ScreenCaptureKit.
# Pinned to 0.3.x because 0.3.6 uses the `objc` 0.2 ecosystem with no Swift
# build-script bridge, and the trait-based API here is significantly smaller
# than hand-rolling `SCStreamOutput` through `objc2-screen-capture-kit`.
screencapturekit = "0.3.6"
core-foundation = "0.10"
core-media-rs = "0.3"
core-audio-types-rs = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_SystemInformation",
    "implement",
] }
windows-core = "0.58"

# (No macOS-specific dependencies in Project A — see plan scope amendment.)
