syntax = "proto3";

package voicebird;

// Audio streaming service for Voice Bird desktop application
// Bidirectional streaming for real-time audio capture and transcription
service AudioStreaming {
  // Bidirectional streaming: client sends audio chunks, server sends transcriptions
  rpc StreamAudio(stream AudioChunk) returns (stream TranscriptionResponse);
}

// Audio chunk sent from client to server
message AudioChunk {
  // Session identifier (UUID)
  string session_id = 1;

  // Audio data (Opus-encoded packets)
  bytes audio_data = 2;

  // Sequence number for ordering and detecting drops
  uint32 sequence = 3;

  // Unix timestamp in milliseconds
  uint64 timestamp = 4;

  // Session metadata (only sent in first chunk)
  optional SessionMetadata metadata = 5;
}

// Session initialization metadata
message SessionMetadata {
  // Audio device name (e.g., "Speakers (Realtek HD Audio)")
  string device_name = 1;

  // Device type: "input" or "output"
  string device_type = 2;

  // Sample rate in Hz (e.g., 48000)
  uint32 sample_rate = 3;

  // Number of audio channels (1 = mono, 2 = stereo)
  uint32 channels = 4;

  // Audio codec (always "opus")
  string codec = 5;

  // Opus bitrate in bits per second (e.g., 24000 = 24 kbps)
  uint32 bitrate = 6;

  // Frame duration in milliseconds (20ms = 960 samples at 48kHz)
  uint32 frame_duration_ms = 7;
}

// Response from server to client
message TranscriptionResponse {
  oneof response {
    StatusMessage status = 1;
    Transcript transcript = 2;
    ErrorMessage error = 3;
  }
}

// Status update (connection, session lifecycle)
message StatusMessage {
  string session_id = 1;
  string message = 2;
}

// Transcription result from AssemblyAI
message Transcript {
  string session_id = 1;
  string text = 2;
  bool is_final = 3;
  float confidence = 4;

  // Optional timestamp offsets
  optional uint32 audio_start = 5;
  optional uint32 audio_end = 6;
}

// Error message
message ErrorMessage {
  string code = 1;
  string message = 2;
  optional string details = 3;
}
