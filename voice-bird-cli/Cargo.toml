[package]
name = "voice-bird-cli"
version = "0.2.0"
edition = "2021"
description = "Voice Bird CLI - Terminal audio streaming for voice transcription"

[[bin]]
name = "voice-bird-cli"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Audio
cpal = "0.15"
hound = "3.5"
rubato = "0.14"

# Networking
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["connect", "native-tls"], default-features = false }
futures-util = "0.3"
http = "1.0"

# Logging
log = "0.4"
fern = "0.7"

# Clipboard
arboard = "3"

# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_SystemInformation",
    "implement",
] }
windows-core = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.3"
