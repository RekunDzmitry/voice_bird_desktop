[package]
name = "voice-bird-next"
version = "0.1.0"
edition = "2021"
description = "Voice Bird — next-generation TUI (in-progress rewrite, lives beside voice-bird-cli)"
license-file = "../LICENSE"
publish = false

[lib]
name = "voice_bird_next"
path = "src/lib.rs"

[[bin]]
name = "voice-bird-next"
path = "src/main.rs"

[features]
# Native Whisper is optional so no-default-feature checks do not build whisper.cpp.
default = ["net", "local-engine"]
net = ["dep:reqwest"]
local-engine = ["dep:whisper-rs"]

[dependencies]
anyhow = "1"
rubato = "0.14"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
directories = "5"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"
# Format-specific unpack for the Nemotron tarball. Always-on: a
# verified staging file is meaningless if we can't actually install it.
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["stream", "rustls-tls"]

[dependencies.sha2]
version = "0.10"

[dependencies.hex]
version = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "libc", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
block2 = "0.6"
dispatch2 = "0.3"
whisper-rs = { version = "0.13", optional = true, features = ["metal", "coreml", "whisper-cpp-log", "raw-api"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.13", optional = true, features = ["whisper-cpp-log"] }

[dev-dependencies]
hound = "3"
pretty_assertions = "1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
