[package]
name = "voice-bird-next"
version = "0.1.0"
edition = "2021"
description = "Voice Bird — next-generation TUI (in-progress rewrite, lives beside voice-bird-cli)"
license-file = "../LICENSE"
publish = false

[lib]
name = "voice_bird_next"
path = "src/lib.rs"

[[bin]]
name = "voice-bird-next"
path = "src/main.rs"

[features]
# Default-on: pulls `reqwest` + `sha2` + `hex` for the live downloader.
# Tests and `download_flow.rs` exercise the full flow through the
# fixture downloader without this feature; running
# `cargo test --no-default-features` finishes in seconds.
default = ["net"]
net = ["dep:reqwest"]

[dependencies]
chrono = "0.4"
directories = "5"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format-specific unpack for the Nemotron tarball. Always-on: a
# verified staging file is meaningless if we can't actually install it.
flate2 = "1"
tar = "0.4"

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["blocking", "rustls-tls"]

[dependencies.sha2]
version = "0.10"

[dependencies.hex]
version = "0.4"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
tempfile = "3"