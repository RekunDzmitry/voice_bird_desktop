[package]
name = "voice-bird-next"
version = "0.1.0"
edition = "2021"
description = "Voice Bird — next-generation TUI (in-progress rewrite, lives beside voice-bird-cli)"
license-file = "../LICENSE"
publish = false

[lib]
name = "voice_bird_next"
path = "src/lib.rs"

[[bin]]
name = "voice-bird-next"
path = "src/main.rs"

[dependencies]
# Same versions as the root crate so Cargo.lock keeps one copy and render
# code ports over by copy-paste.
chrono = "0.4"
directories = "5"
ratatui = "0.29"
crossterm = "0.28"
# Serde + JSON for the on-disk event log (next/src/event_log.rs).
# Both crates are already in the workspace's Cargo.lock via the root
# crate, so adding them here only registers direct-dep metadata; the
# build graph doesn't grow a single new compilation unit.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
tempfile = "3"